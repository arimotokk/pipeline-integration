services:
  - type: web
    name: vat-pipeline
    env: python
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn app-deploy:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vat-pipeline-db
          property: connectionString

databases:
  - name: vat-pipeline-db
    databaseName: vat_invoices
    user: vat_user
